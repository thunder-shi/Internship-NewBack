# Docker Compose：SPRING_PROFILES_ACTIVE=docker
# 覆盖默认 application.properties 中对 RedisAutoConfiguration 的排除，使容器内连接 Compose 中的 Redis
spring.autoconfigure.exclude=

# 生产环境中 kkFileView 与 MinIO 位于同一 Docker 网络，使用 Compose 服务名拉取文件。
minio.kkfileview-endpoint=http://minio:9000
# 浏览器通过主站同域路径访问 kkFileView，无需单独子域名或暴露 8012 端口。
kkfileview.base-url=https://sxsxglxt.ahsdxy.edu.cn/api/kkfileview

# 生产 Docker 环境关闭 Swagger / OpenAPI
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
